<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2WO STORE - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">⚡ H2WO STORE ADMIN</div>
        <nav>
            <a href="index.html">Back to Store</a>
        </nav>
    </header>

    <main class="container">
        <section id="auth-section" class="auth-box">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label for="adminTokenInput">Admin Security Token:</label>
                <input type="password" id="adminTokenInput" placeholder="Enter Admin Token">
                <button onclick="loginAdmin()" class="btn-primary">Login</button>
            </div>
        </section>

        <section id="dashboard-section" class="hidden">
            <h2>Pending & Recent Orders</h2>
            <button onclick="loadAdminOrders()" class="btn-secondary">Refresh Orders</button>
            <div class="table-responsive">
                <table id="ordersTable">
                    <thead>
                        <tr>
                            <th>Tx ID</th>
                            <th>Game</th>
                            <th>Item</th>
                            <th>Amount</th>
                            <th>Player ID</th>
                            <th>GCash Ref</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
